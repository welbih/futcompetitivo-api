name: futcompetitivo-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: futcompetitivoDB
    restart: unless-stopped
    environment:
      POSTGRES_DB: futcompetitivo
      POSTGRES_USER: ${DEV_DB_USERNAME:-futcompetitivo}
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:-futcompetitivo_dev}
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
