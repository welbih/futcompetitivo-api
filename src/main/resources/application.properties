spring.application.name=futcompetitivo-api
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${APP_PROFILE:default}

security.client-id=${CLIENT_ID:futcompetitivo}
security.client-secret=${CLIENT_SECRET:desenvolvimento-local}
jwt.duration=${JWT_DURATION:3600}
jwt.issuer=${JWT_ISSUER:http://localhost:8080}
jwt.jwk=${JWT_JWK:}
cors.origins=${CORS_ORIGINS:http://localhost:4200,http://localhost:5173}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.health.db.enabled=true
