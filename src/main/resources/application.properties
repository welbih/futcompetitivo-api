spring.application.name=futcompetitivo-api
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${APP_PROFILE:default}

security.client-id=${CLIENT_ID:futcompetitivo}
security.client-secret=${CLIENT_SECRET:desenvolvimento-local}
jwt.duration=${JWT_DURATION:3600}
jwt.issuer=${JWT_ISSUER:http://localhost:8080}
jwt.jwk=${JWT_JWK:}
cors.origins=${CORS_ORIGINS:http://localhost:4200,http://localhost:5173}

campeonatos.sse.heartbeat-ms=${SSE_HEARTBEAT_MS:15000}
campeonatos.sse.timeout-ms=${SSE_TIMEOUT_MS:1800000}
campeonatos.sse.timeout-envio-ms=${SSE_TIMEOUT_ENVIO_MS:10000}
campeonatos.sse.capacidade-fila=${SSE_CAPACIDADE_FILA:32}
campeonatos.sse.max-conexoes=${SSE_MAX_CONEXOES:1000}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.health.db.enabled=true
