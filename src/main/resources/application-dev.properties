server.port=${PORT:8080}

spring.datasource.url=${DEV_DB_URL:jdbc:postgresql://localhost:${DEV_DB_PORT:5433}/futcompetitivo}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DEV_DB_USERNAME:futcompetitivo}
spring.datasource.password=${DEV_DB_PASSWORD:futcompetitivo_dev}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/postgresql,classpath:db/seed/dev
spring.flyway.clean-disabled=true
spring.h2.console.enabled=false
